<!DOCTYPE html>
<html>
<head>
    <title>Lobby Participants</title>
</head>
<body>

<h2>Lobby: {{ lobby.name }}</h2>
<p>Kill Reward: ₹{{ lobby.kill_reward }} per kill</p>

{% for p in participants %}
    <div style="border:1px solid #000; padding:10px; margin-bottom:10px;">
        <p>User ID: {{ p.user_id }}</p>

        <form method="POST" action="/admin/credit-kills">
            <input type="hidden" name="user_id" value="{{ p.user_id }}">
            <input type="hidden" name="lobby_id" value="{{ lobby.id }}">

            <label>Kills:</label>
            <input type="number" name="kills" required>

            <button type="submit">Credit Reward</button>
        </form>
    </div>
{% endfor %}

</body>
</html>
