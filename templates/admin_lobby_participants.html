{% extends "base.html" %}
{% block title %}Lobby Participants{% endblock %}

{% block content %}

<h2 class="mb-4">LOBBY: {{ lobby.name }}</h2>
<p class="text-muted mb-4">
    Kill Reward: ₹{{ lobby.kill_reward }} per kill
</p>

<div class="row">
{% for p in participants %}
    <div class="col-md-4">
        <div class="ff-card text-center">

            <h5>PLAYER ID</h5>
            <p class="wallet-glow">{{ p.user_id }}</p>

            <form method="POST" action="/admin/credit-kills" class="mt-3">
                <input type="hidden" name="user_id" value="{{ p.user_id }}">
                <input type="hidden" name="lobby_id" value="{{ lobby.id }}">

                <input
                    type="number"
                    name="kills"
                    placeholder="Kills"
                    class="form-control ff-input mb-3"
                    required
                >

                <button class="ff-btn w-100">
                    CREDIT REWARD
                </button>
            </form>

        </div>
    </div>
{% endfor %}
</div>

{% endblock %}
