{% extends "base.html" %}
{% block title %}Withdraw{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-5">

<div class="ff-card text-center">

    <h2>WITHDRAW FUNDS</h2>
    <p class="text-muted mb-4">
        Enter amount to withdraw from wallet
    </p>

    <form method="POST">

        <input
            type="number"
            name="amount"
            placeholder="Amount"
            class="form-control ff-input mb-4"
            required
        >

        <button class="ff-btn w-100">
            REQUEST WITHDRAWAL
        </button>

    </form>

    <a href="/player/dashboard" class="ff-btn-outline d-block mt-4">
        BACK TO DASHBOARD
    </a>

</div>

</div>
</div>

{% endblock %}
