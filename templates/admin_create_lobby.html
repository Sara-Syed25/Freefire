<!DOCTYPE html>
<html>
<head>
    <title>Create Lobby</title>
</head>
<body>
    <h2>Create New Lobby</h2>

    <form method="POST" action="/admin/create-lobby">

        <label>Lobby Name</label><br>
        <input type="text" name="name" required><br><br>

        <label>Match Type</label><br>
        <select name="match_type" required>
            <option value="solo">Solo</option>
            <option value="duo">Duo</option>
            <option value="squad">Squad</option>
        </select><br><br>

        <label>Entry Fee (₹)</label><br>
        <input type="number" name="entry_fee" required><br><br>

        <label>Kill Reward (₹ per kill)</label><br>
        <input type="number" name="kill_reward" required><br><br>

        <label>Total Slots</label><br>
        <input type="number" name="total_slots" required><br><br>

        <button type="submit">Create Lobby</button>

    </form>
</body>
</html>
