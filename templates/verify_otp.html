{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-4">

<div class="ff-card text-center">
    <h3>Verify OTP</h3>
    <p class="text-muted">Enter the 6-digit OTP sent to your email</p>

    <form method="POST">
        <input
            class="form-control ff-input mb-3"
            name="otp"
            placeholder="Enter OTP"
            required
        >
        <button class="ff-btn w-100">Verify</button>
    </form>
</div>

</div>
</div>
{% endblock %}
