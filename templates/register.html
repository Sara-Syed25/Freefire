{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="ff-card text-center">
            <h2>JOIN THE WARZONE</h2>
            <p class="text-muted">Create your player account</p>

            <form method="POST" class="mt-4">

                <input class="form-control ff-input mb-3" 
                       name="username" placeholder="Username" required>

                <input class="form-control ff-input mb-3" 
                       type="email" name="email" placeholder="Email" required>

                <input class="form-control ff-input mb-4" 
                       type="password" name="password" placeholder="Password" required>

                <button class="ff-btn w-100">REGISTER</button>

            </form>
        </div>

    </div>
</div>

{% endblock %}
